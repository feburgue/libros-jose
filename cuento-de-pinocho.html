<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pinocho — Cuento para los niños</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Pinocho, cuento para los niños. Libro ilustrado para leer pasando las páginas.">
<meta name="theme-color" content="#3a2415">
<link rel="shortcut icon" type="image/png" href="./favicon.ico">

<meta property="og:type" content="book">
<meta property="og:title" content="Pinocho — Cuento para los niños">
<meta property="og:description" content="Libro ilustrado para leer pasando las páginas.">
<meta property="og:image" content="files/shot.png">

<link rel="stylesheet" href="./lib/stPageFlip.css">
<style>
  :root{
    --ink:#3a2415;
    --cream:#fff6e7;
    --amber:#f2a567;
    --amber-deep:#d97b3c;
    --bar:rgba(58,36,21,.55);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--cream);
    background:#2a1a0f radial-gradient(ellipse at 50% 35%, #7a4a24 0%, #40270f 55%, #241608 100%) fixed;
    display:flex; flex-direction:column;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- barra superior ---------- */
  header{
    display:flex; align-items:center; gap:12px;
    padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top));
    background:var(--bar); backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(255,246,231,.12);
    flex:0 0 auto; z-index:5;
  }
  h1{
    margin:0; font-size:16px; font-weight:600; letter-spacing:.2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .spacer{flex:1}
  .tools{display:flex; gap:4px}
  button.tool{
    all:unset; cursor:pointer; display:grid; place-items:center;
    width:38px; height:38px; border-radius:10px; color:var(--cream);
  }
  button.tool:hover{background:rgba(255,246,231,.14)}
  button.tool:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  button.tool[aria-pressed="false"]{opacity:.45}
  button.tool svg{width:21px; height:21px; fill:none; stroke:currentColor;
    stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

  /* ---------- escenario ---------- */
  main{flex:1 1 auto; position:relative; display:grid; place-items:center; min-height:0}
  /* la tapa se muestra sola: corremos el libro para que quede centrada */
  #shift{transition:transform .35s ease}
  .page{background:#fff}
  .page img{width:100%; height:100%; display:block}
  .stf__item{box-shadow:0 0 18px rgba(0,0,0,.35)}

  /* flechas */
  .nav{
    all:unset; position:absolute; top:0; bottom:0; width:clamp(44px,7vw,90px);
    display:grid; place-items:center; cursor:pointer; color:var(--cream);
    opacity:.35; transition:opacity .2s; z-index:4;
  }
  .nav:hover{opacity:1}
  .nav:focus-visible{outline:2px solid var(--amber); outline-offset:-6px; opacity:1}
  .nav[disabled]{opacity:0; pointer-events:none}
  .nav.prev{left:0} .nav.next{right:0}
  .nav svg{width:34px; height:34px; fill:none; stroke:currentColor;
    stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}

  /* ---------- barra inferior ---------- */
  footer{
    flex:0 0 auto; padding:8px 16px; padding-bottom:calc(8px + env(safe-area-inset-bottom));
    background:var(--bar); backdrop-filter:blur(8px);
    border-top:1px solid rgba(255,246,231,.12);
    display:flex; align-items:center; gap:14px; z-index:5;
  }
  #range{
    flex:1; -webkit-appearance:none; appearance:none; height:4px; border-radius:4px;
    background:rgba(255,246,231,.25); cursor:pointer;
  }
  #range::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px;
    border-radius:50%; background:var(--amber); border:2px solid var(--cream)}
  #range::-moz-range-thumb{width:16px; height:16px; border:2px solid var(--cream);
    border-radius:50%; background:var(--amber)}
  #counter{font-size:13px; font-variant-numeric:tabular-nums; opacity:.85; min-width:62px; text-align:right}

  /* ---------- carga ---------- */
  #loader{
    position:fixed; inset:0; z-index:10; display:grid; place-items:center;
    background:#241608; gap:0; text-align:center;
  }
  #loader .box{display:grid; gap:18px; justify-items:center; padding:24px}
  #loader p{margin:0; font-size:15px; opacity:.8}
  .track{width:min(280px,70vw); height:5px; border-radius:5px; background:rgba(255,246,231,.18); overflow:hidden}
  .fill{height:100%; width:0%; border-radius:5px; background:linear-gradient(90deg,var(--amber),var(--amber-deep)); transition:width .25s}
  #loader.hidden{opacity:0; pointer-events:none; transition:opacity .5s}
  #error{display:none; max-width:min(440px,84vw); line-height:1.5; font-size:14px}

  @media (max-width:640px){
    h1{font-size:14px}
    header,footer{padding-left:10px; padding-right:10px}
  }
</style>
</head>
<body>

<header>
  <h1>Pinocho <span style="opacity:.6;font-weight:400">· Cuento para los niños</span></h1>
  <div class="spacer"></div>
  <div class="tools">
    <button class="tool" id="btn-sound" aria-pressed="true" aria-label="Sonido al pasar la página" title="Sonido">
      <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
    <button class="tool" id="btn-full" aria-label="Pantalla completa" title="Pantalla completa">
      <svg viewBox="0 0 24 24"><path d="M8 3H3v5"/><path d="M16 3h5v5"/><path d="M16 21h5v-5"/><path d="M8 21H3v-5"/></svg>
    </button>
  </div>
</header>

<main>
  <button class="nav prev" id="prev" aria-label="Página anterior">
    <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>
  </button>
  <div id="shift"><div id="flipbook"></div></div>
  <button class="nav next" id="next" aria-label="Página siguiente">
    <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>
  </button>
</main>

<footer>
  <input type="range" id="range" min="0" max="0" value="0" step="1" aria-label="Ir a una página">
  <span id="counter">— / —</span>
</footer>

<div id="loader">
  <div class="box">
    <p id="status">Preparando el cuento…</p>
    <div class="track"><div class="fill" id="fill"></div></div>
    <p id="error"></p>
  </div>
</div>

<!-- pdf.js (Mozilla, Apache-2.0) rasteriza el PDF;
     StPageFlip / page-flip 2.0.7 (Nodlik, MIT) hace el pasaje de páginas. -->
<script src="./pdfjs-dist/build/pdf.min.js"></script>
<script src="./lib/page-flip.browser.js"></script>
<script>
(function () {
  "use strict";

  var PDF_URL = "./files/downloads/book.pdf";

  var statusEl = document.getElementById("status");
  var fillEl   = document.getElementById("fill");
  var errorEl  = document.getElementById("error");
  var loader   = document.getElementById("loader");
  var counter  = document.getElementById("counter");
  var range    = document.getElementById("range");
  var prevBtn  = document.getElementById("prev");
  var nextBtn  = document.getElementById("next");

  function fail(msg) {
    statusEl.textContent = "No se pudo abrir el cuento";
    errorEl.style.display = "block";
    errorEl.textContent = msg;
  }

  // El worker debe apuntarse a mano o pdf.js cae al "fake worker" y bloquea la UI.
  pdfjsLib.GlobalWorkerOptions.workerSrc = "./pdfjs-dist/build/pdf.worker.min.js";

  // --- sonido de página, sintetizado: evita depender de un archivo de audio ---
  var soundOn = true, audio = null;
  function paperSound() {
    if (!soundOn) return;
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audio) audio = new Ctx();
      if (audio.state === "suspended") audio.resume();

      var dur = 0.32, n = Math.floor(audio.sampleRate * dur);
      var buf = audio.createBuffer(1, n, audio.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < n; i++) {
        var t = i / n;                       // ruido con ataque suave y cola larga
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.5) * Math.min(1, t * 24);
      }
      var src = audio.createBufferSource(); src.buffer = buf;
      var flt = audio.createBiquadFilter(); flt.type = "bandpass";
      flt.frequency.value = 1800; flt.Q.value = 0.6;
      var vol = audio.createGain(); vol.gain.value = 0.16;
      src.connect(flt); flt.connect(vol); vol.connect(audio.destination);
      src.start();
    } catch (e) { /* sin audio, el libro igual funciona */ }
  }

  document.getElementById("btn-sound").addEventListener("click", function () {
    soundOn = !soundOn;
    this.setAttribute("aria-pressed", String(soundOn));
  });

  document.getElementById("btn-full").addEventListener("click", function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  });

  // --- 1. rasterizar el PDF ---
  function renderAll(pdf) {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var targetW = Math.min(1500, Math.max(760, Math.round(window.innerWidth * dpr)));
    var images = [], ratio = 0.707;

    function one(num) {
      return pdf.getPage(num).then(function (page) {
        var base = page.getViewport({ scale: 1 });
        ratio = base.width / base.height;
        var viewport = page.getViewport({ scale: targetW / base.width });

        var canvas = document.createElement("canvas");
        canvas.width = Math.round(viewport.width);
        canvas.height = Math.round(viewport.height);
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        return page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function () {
          images[num - 1] = canvas.toDataURL("image/jpeg", 0.86);
          canvas.width = canvas.height = 0;   // liberar memoria en móviles
          fillEl.style.width = Math.round((num / pdf.numPages) * 100) + "%";
          statusEl.textContent = "Cargando página " + num + " de " + pdf.numPages + "…";
        });
      });
    }

    var chain = Promise.resolve();
    for (var i = 1; i <= pdf.numPages; i++) chain = chain.then(one.bind(null, i));
    return chain.then(function () { return { images: images, ratio: ratio }; });
  }

  // --- 2. montar el libro ---
  function mount(images, ratio) {
    var el    = document.getElementById("flipbook");
    var shift = document.getElementById("shift");
    var main  = document.querySelector("main");
    var last  = images.length - 1;
    var flip = null, portrait = false, pageW = 0;

    function layout() {
      var vw = main.clientWidth, vh = main.clientHeight;
      portrait = vw < 760;
      var spread = portrait ? 1 : 2;
      // la altura manda; si el ancho no alcanza para la doble página, se achica
      var h = vh * 0.95;
      var w = h * ratio;
      var maxW = (vw - (portrait ? 24 : 110)) / spread;
      if (w > maxW) { w = maxW; h = w / ratio; }
      return { w: Math.floor(w), h: Math.floor(h) };
    }

    // La tapa y la contratapa se muestran solas, ocupando media hoja del
    // desplegado: sin esto quedarían corridas a un costado. En vez de deducir
    // de qué lado cayeron, medimos las páginas visibles y las centramos.
    function recenter(retry) {
      // hay que medir sin el corrimiento puesto, y recién cuando StPageFlip ya
      // posicionó las hojas: de ahí los dos frames de espera
      requestAnimationFrame(function () {
        shift.style.transition = "none";
        shift.style.transform = "translateX(0px)";

        requestAnimationFrame(function () {
          var l = Infinity, r = -Infinity, shown = [];
          Array.prototype.forEach.call(el.querySelectorAll(".stf__item"), function (n) {
            if (getComputedStyle(n).display === "none") return;
            var b = n.getBoundingClientRect();
            if (b.width < 1) return;
            l = Math.min(l, b.left); r = Math.max(r, b.right);
            // StPageFlip agrega sus clases sobre el mismo div, no lo envuelve
            var pg = n.classList.contains("page") ? n : n.querySelector(".page");
            if (pg && pg.dataset.idx !== undefined) shown.push(Number(pg.dataset.idx) + 1);
          });

          // el contador sale de las hojas a la vista: "4-5 / 15" en doble página
          if (shown.length) {
            shown.sort(function (a, b) { return a - b; });
            counter.textContent =
              (shown.length > 1 ? shown[0] + "-" + shown[shown.length - 1] : shown[0]) +
              " / " + images.length;
          }

          if (l === Infinity) {                 // todavía no hay nada medible
            shift.style.transition = "";
            if (retry !== false) setTimeout(function () { recenter(false); }, 80);
            return;
          }

          var box = main.getBoundingClientRect();
          var dx = Math.round((box.left + box.width / 2) - (l + r) / 2);
          shift.style.transition = "";
          shift.style.transform = "translateX(" + dx + "px)";
        });
      });
    }

    function build(startPage) {
      var d = layout();
      pageW = d.w;
      // StPageFlip decide horizontal/vertical según el ancho del contenedor, y
      // dentro de un grid centrado ese ancho es cero: hay que fijarlo a mano.
      var full = (portrait ? d.w : d.w * 2) + 2;
      shift.style.width = full + "px";
      el.style.width = full + "px";
      el.innerHTML = "";
      images.forEach(function (src, idx) {
        var pg = document.createElement("div");
        pg.className = "page";
        pg.dataset.idx = idx;
        if (idx === 0 || idx === last) pg.setAttribute("data-density", "hard");
        var im = document.createElement("img");
        im.src = src;
        im.alt = "Página " + (idx + 1);
        pg.appendChild(im);
        el.appendChild(pg);
      });

      flip = new St.PageFlip(el, {
        width: d.w, height: d.h,
        size: "fixed",
        showCover: true,
        usePortrait: true,
        mobileScrollSupport: false,
        maxShadowOpacity: 0.45,
        flippingTime: 700,
        drawShadow: true
      });
      flip.loadFromHTML(el.querySelectorAll(".page"));
      flip.on("flip", function (e) { sync(e.data); });
      // al arrancar el giro el libro ya ocupa la doble página: sacamos el corrimiento
      flip.on("changeState", function (e) {
        if (e.data === "flipping") { paperSound(); shift.style.transform = "translateX(0px)"; }
        if (e.data === "read") recenter();
      });
      if (startPage) flip.turnToPage(startPage);
      sync(flip.getCurrentPageIndex());
    }

    function sync(i) {
      range.max = last; range.value = i;
      counter.textContent = (i + 1) + " / " + images.length;
      prevBtn.disabled = i <= 0;
      nextBtn.disabled = i >= last;
      recenter();
    }

    build(0);

    prevBtn.addEventListener("click", function () { flip.flipPrev(); });
    nextBtn.addEventListener("click", function () { flip.flipNext(); });
    range.addEventListener("input", function () { flip.turnToPage(Number(this.value)); sync(Number(this.value)); });

    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft")  { flip.flipPrev(); }
      if (e.key === "ArrowRight") { flip.flipNext(); }
    });

    // rehacer el libro al cambiar el tamaño, conservando la página actual
    var t = null;
    window.addEventListener("resize", function () {
      clearTimeout(t);
      t = setTimeout(function () {
        var at = flip.getCurrentPageIndex();
        flip.destroy();
        build(at);
      }, 200);
    });
  }

  // --- arranque ---
  pdfjsLib.getDocument(PDF_URL).promise
    .then(renderAll)
    .then(function (r) {
      mount(r.images, r.ratio);
      loader.classList.add("hidden");
      setTimeout(function () { loader.style.display = "none"; }, 600);
    })
    .catch(function (e) { fail(String(e && e.message || e)); });
})();
</script>
</body>
</html>
