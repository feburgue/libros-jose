<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Los libros de Jose</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Cuentos ilustrados para leer pasando las páginas.">
<meta name="theme-color" content="#3a2415">
<link rel="shortcut icon" type="image/png" href="./favicon.ico">
<meta property="og:title" content="Los libros de Jose">
<meta property="og:description" content="Cuentos ilustrados para leer pasando las páginas.">
<style>
  :root{ --cream:#fff6e7; --amber:#f2a567; }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100%;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--cream);
    background:#2a1a0f radial-gradient(ellipse at 50% 0%, #7a4a24 0%, #40270f 55%, #241608 100%) fixed;
    -webkit-tap-highlight-color:transparent;
  }
  header{
    padding:clamp(28px,6vw,56px) 20px clamp(18px,3vw,28px);
    padding-top:calc(clamp(28px,6vw,56px) + env(safe-area-inset-top));
    text-align:center;
  }
  h1{margin:0; font-size:clamp(26px,5.5vw,40px); letter-spacing:-.4px}
  header p{margin:10px 0 0; opacity:.7; font-size:clamp(14px,2.4vw,16px)}

  main{
    max-width:1180px; margin:0 auto;
    padding:0 clamp(16px,3vw,28px) calc(56px + env(safe-area-inset-bottom));
    display:grid; gap:clamp(18px,3vw,30px);
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  }
  a.abrir{
    display:block; text-decoration:none; color:inherit;
    transition:transform .18s ease;
  }
  a.abrir:hover,a.abrir:focus-visible{transform:translateY(-5px)}
  a.abrir:focus-visible{outline:2px solid var(--amber); outline-offset:6px; border-radius:6px}
  .tapa{
    width:100%; display:block; border-radius:4px;
    background:rgba(255,246,231,.07);
    box-shadow:0 8px 22px rgba(0,0,0,.45), 0 1px 0 rgba(255,246,231,.15) inset;
    aspect-ratio:3/4; object-fit:cover; object-position:top center;
  }
  .titulo{margin:12px 2px 2px; font-size:15px; font-weight:600; line-height:1.3}
  .meta{margin:0 2px; font-size:12.5px; opacity:.6; line-height:1.4}
  /* enlace aparte del que abre el visor: no se puede anidar un <a> dentro de otro */
  a.bajar{
    display:inline-block; margin:6px 2px 0; padding:2px 8px 3px;
    font-size:12px; text-decoration:none; color:var(--cream);
    border:1px solid rgba(255,246,231,.3); border-radius:999px; opacity:.65;
  }
  a.bajar:hover{opacity:1; background:rgba(255,246,231,.12)}
  a.bajar:focus-visible{outline:2px solid var(--amber); outline-offset:2px; opacity:1}

  footer{
    text-align:center; padding:0 20px calc(40px + env(safe-area-inset-bottom));
    font-size:13px; opacity:.45; line-height:1.6;
  }
  @media (prefers-reduced-motion:reduce){ a.libro{transition:none} a.libro:hover{transform:none} }
</style>
</head>
<body>

<header>
  <h1>Los libros de Jose</h1>
  <p>Tocá una tapa para leer</p>
</header>

<main id="estante"></main>

<footer>
  <p id="pie"></p>
</footer>

<script>
(function () {
  "use strict";
  var estante = document.getElementById("estante");

  fetch("./libros.json").then(function (r) { return r.json(); }).then(function (libros) {
    function mb(bytes) {
      return (bytes / 1048576).toFixed(1).replace(".", ",") + " MB";
    }

    var peso = 0;
    libros.forEach(function (l) {
      var caja = document.createElement("div");
      caja.className = "libro";

      var a = document.createElement("a");
      a.className = "abrir";
      a.href = l.pagina;

      var img = document.createElement("img");
      img.className = "tapa";
      img.src = "portadas/" + l.slug + ".jpg";
      img.alt = "Tapa de " + l.titulo;
      img.loading = "lazy";
      img.decoding = "async";

      var t = document.createElement("p");
      t.className = "titulo";
      t.textContent = l.titulo;

      var m = document.createElement("p");
      m.className = "meta";
      m.textContent = (l.subtitulo ? l.subtitulo + " · " : "") + l.paginas + " páginas";

      a.appendChild(img); a.appendChild(t); a.appendChild(m);
      caja.appendChild(a);

      var bajar = document.createElement("a");
      bajar.className = "bajar";
      bajar.href = "pdf/" + l.slug + ".pdf";
      bajar.setAttribute("download", "");
      bajar.setAttribute("aria-label", "Descargar " + l.titulo + " en PDF");
      bajar.textContent = "PDF ↓ " + mb(l.peso);
      caja.appendChild(bajar);

      peso += l.peso;
      estante.appendChild(caja);
    });
    document.getElementById("pie").textContent =
      libros.length + " libros · " + mb(peso) + " en total";
  }).catch(function () {
    estante.innerHTML = '<p style="grid-column:1/-1;text-align:center;opacity:.7">' +
      'No se pudo cargar la lista de libros.</p>';
  });
})();
</script>
</body>
</html>
