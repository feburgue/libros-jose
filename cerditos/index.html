<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Los tres chanchitos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1a0f">
<link rel="shortcut icon" type="image/png" href="../favicon.ico">
<style>
  :root{ --crema:#fff6e7; --ambar:#f2a567; --tinta:#3a2415 }
  html,body{margin:0; height:100%; background:#1b1410; overflow:hidden; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none}
  #escena{position:fixed; inset:0; width:100%; height:100%; display:block}
  /* la cámara se desliza despacio por el sendero */
  #mundo, #lomas{transition:transform 4s cubic-bezier(.45,0,.25,1)}
  .cielo{transition:opacity 5s ease}
  #sol, #luna{transition:transform 6s ease, opacity 6s ease}
  .estrella{opacity:0; transition:opacity 4s ease}
  .noche .estrella{opacity:.9; animation:titilar 4s ease-in-out infinite}
  .noche .estrella:nth-child(3n){animation-delay:1.3s} .noche .estrella:nth-child(3n+1){animation-delay:2.6s}
  @keyframes titilar{50%{opacity:.4}}
  .nube{animation:nube linear infinite}
  @keyframes nube{from{transform:translateX(-260px)} to{transform:translateX(1060px)}}
  .pasto{transform-box:fill-box; transform-origin:50% 100%; animation:pasto 5s ease-in-out infinite}
  @keyframes pasto{50%{transform:rotate(4deg)}}
  .humo{animation:humo 6s ease-out infinite; opacity:0}
  @keyframes humo{0%{transform:translate(0,0) scale(.5); opacity:0} 20%{opacity:.6} 100%{transform:translate(18px,-70px) scale(1.6); opacity:0}}
  /* personajes: caminan despacito y se balancean al caminar */
  .bicho{transition:transform 3.2s linear, opacity 1.5s ease}
  .bicho.rapido{transition:transform 1.8s linear, opacity 1s ease}
  .bicho > g{transform-box:fill-box; transform-origin:50% 100%}
  .bicho.camina > g{animation:paso .45s ease-in-out infinite}
  .bicho.rapido.camina > g{animation-duration:.28s}
  @keyframes paso{50%{transform:translateY(-4px) rotate(2deg)}}
  .respira > g{animation:respira 3.5s ease-in-out infinite}
  @keyframes respira{50%{transform:scaleY(1.03)}}
  .oculto{opacity:0}
  /* el lobo sopla */
  #viento path{opacity:0}
  .soplando #viento path{animation:viento 1.1s ease-out infinite}
  .soplando #viento path:nth-child(2){animation-delay:.25s} .soplando #viento path:nth-child(3){animation-delay:.5s}
  @keyframes viento{0%{opacity:0; transform:translateX(0)} 30%{opacity:.8} 100%{opacity:0; transform:translateX(70px)}}
  .soplando #cachetes{transform:scale(1.35); transform-box:fill-box; transform-origin:center}
  #cachetes{transition:transform .4s}
  .sentado #cuerpoLobo{transform:translate(0,14px) scaleY(.85); transform-box:fill-box; transform-origin:50% 100%}
  #cuerpoLobo{transition:transform 1.2s ease}
  /* casa de paja que vuela y palitos que se caen */
  #paja{transition:transform 3s ease-in, opacity 3s ease-in; transform-box:fill-box; transform-origin:50% 100%}
  #paja.volada{transform:translate(160px,-150px) rotate(25deg) scale(.4); opacity:0}
  .brizna{opacity:0}
  .volando .brizna{animation:brizna 3.5s ease-out forwards}
  @keyframes brizna{0%{opacity:1; transform:translate(0,0) rotate(0)} 100%{opacity:0; transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
  .palito{transform-box:fill-box; transform-origin:50% 100%; transition:transform 1.4s ease-in}
  .caida .palito{transform:rotate(var(--caer))}
  #techoPalos{transition:transform 1.6s ease-in, opacity 1.6s; transform-box:fill-box; transform-origin:50% 100%}
  .caida #techoPalos{transform:translate(20px,70px) rotate(14deg); opacity:.0}
  #caritas, #sopa, #luzVentana{transition:opacity 2s ease}
  /* textos y controles */
  #texto{position:fixed; left:50%; bottom:max(12px, env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(880px, calc(100% - 24px));
    background:rgba(255,248,236,.86); color:var(--tinta); border-radius:16px; padding:10px 16px; box-shadow:0 4px 18px rgba(0,0,0,.25);
    font:15px/1.4 Georgia,'Times New Roman',serif; transition:opacity .8s; max-height:32vh; overflow:auto}
  #texto:empty, body:not(.con-texto) #texto{opacity:0; pointer-events:none}
  #verTexto{font:700 16px/1 Georgia,serif}
  body.con-texto #verTexto{background:rgba(242,165,103,.9); color:#3a2415}
  #texto p{margin:0 0 3px}
  #controles{position:fixed; top:max(10px, env(safe-area-inset-top)); right:12px; display:flex; gap:8px}
  #controles button, #controles a{all:unset; cursor:pointer; width:42px; height:42px; border-radius:12px; display:grid; place-items:center;
    background:rgba(42,26,15,.55); color:var(--crema); backdrop-filter:blur(6px)}
  #controles svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  #pausa svg{fill:currentColor; stroke:none}
  #inicio{position:fixed; inset:0; display:grid; place-items:center; background:rgba(27,20,16,.45); transition:opacity 1s}
  #inicio.fuera{opacity:0; pointer-events:none}
  #inicio .caja{text-align:center; color:var(--crema)}
  #inicio h1{margin:0 0 18px; font:bold clamp(28px,6vw,52px)/1.1 Georgia,serif; text-shadow:0 3px 12px rgba(0,0,0,.5)}
  #contar{all:unset; cursor:pointer; background:var(--ambar); color:var(--tinta); font:600 20px/1 system-ui,sans-serif; padding:16px 28px; border-radius:40px;
    box-shadow:0 6px 20px rgba(0,0,0,.35); display:inline-flex; align-items:center; gap:10px}
  #contar svg{width:22px; height:22px; fill:currentColor}
  @media (max-height:430px){ #texto{font-size:13px; padding:7px 12px; max-height:28vh} }
  @media (prefers-reduced-motion:reduce){ .nube,.pasto,.humo,.bicho.camina > g,.respira > g{animation:none} }
</style>
</head>
<body>
<svg id="escena" viewBox="0 0 800 450" preserveAspectRatio="xMidYMax slice" aria-label="Los tres chanchitos"></svg>
<div id="texto" aria-live="polite"></div>
<div id="controles">
  <a href="../index.html" aria-label="Volver a los libros" title="Todos los libros"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></a>
  <button id="verTexto" aria-label="Mostrar el texto" title="Mostrar el texto">Aa</button>
  <button id="atras" aria-label="Escena anterior" title="Anterior"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
  <button id="pausa" aria-label="Pausar" title="Pausar"></button>
  <button id="adelante" aria-label="Escena siguiente" title="Siguiente"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
</div>
<div id="inicio"><div class="caja">
  <h1>Los tres chanchitos</h1>
  <button id="contar"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>Contar el cuento</button>
</div></div>

<script>
(function () {
"use strict";
var $ = function (s) { return document.querySelector(s); };
var svg = $("#escena");

/* ---------- dibujos ---------- */
// Chanchito, con los pies en (0,0) mirando a la derecha; el color es su pañuelo
function chanchito(color) {
  return '<g>' +
    '<path d="M-24 -34 q-12 -2 -9 -10 q3 -6 7 0" fill="none" stroke="#e48aa3" stroke-width="2.5" stroke-linecap="round"/>' +
    '<rect x="-17" y="-12" width="8" height="12" rx="3" fill="#ef9db3"/><rect x="8" y="-12" width="8" height="12" rx="3" fill="#ef9db3"/>' +
    '<ellipse cx="0" cy="-28" rx="27" ry="21" fill="#f7b8c8" stroke="#e08ea6" stroke-width="2"/>' +
    '<path d="M6 -40 q12 10 0 22" fill="none" stroke="' + color + '" stroke-width="7" stroke-linecap="round"/>' +
    '<path d="M12 -63 l-2 -14 l11 9 z M26 -63 l4 -13 l5 14 z" fill="#f2a2b8" stroke="#e08ea6" stroke-width="1.5" stroke-linejoin="round"/>' +
    '<circle cx="20" cy="-50" r="17" fill="#f7b8c8" stroke="#e08ea6" stroke-width="2"/>' +
    '<ellipse cx="34" cy="-46" rx="8" ry="6.5" fill="#f29bb3" stroke="#e08ea6" stroke-width="1.5"/>' +
    '<circle cx="31.5" cy="-46" r="1.4" fill="#b8607a"/><circle cx="36.5" cy="-46" r="1.4" fill="#b8607a"/>' +
    '<circle cx="23" cy="-55" r="2.3" fill="#3a2415"/>' +
    '<ellipse cx="16" cy="-45" rx="4" ry="2.5" fill="#ff8fab" opacity=".45"/>' +
    '</g>';
}
// Lobo gris, más bien tontito que malo; pies en (0,0)
function lobo() {
  return '<g><g id="cuerpoLobo">' +
    '<path d="M-38 -48 q-30 -6 -34 -30 q14 10 30 12 z" fill="#7e8591" stroke="#646a75" stroke-width="2"/>' +
    '<rect x="-24" y="-20" width="11" height="20" rx="4" fill="#7e8591"/><rect x="10" y="-20" width="11" height="20" rx="4" fill="#7e8591"/>' +
    '<ellipse cx="-4" cy="-46" rx="38" ry="30" fill="#949aa6" stroke="#646a75" stroke-width="2"/>' +
    '<ellipse cx="0" cy="-40" rx="20" ry="17" fill="#c9ccd3"/>' +
    '<path d="M18 -96 l-4 -22 l14 14 z M36 -96 l6 -21 l6 19 z" fill="#7e8591" stroke="#646a75" stroke-width="2" stroke-linejoin="round"/>' +
    '<circle cx="30" cy="-82" r="23" fill="#949aa6" stroke="#646a75" stroke-width="2"/>' +
    '<g id="cachetes"><ellipse cx="50" cy="-76" rx="18" ry="11" fill="#a9aeb8" stroke="#646a75" stroke-width="2"/></g>' +
    '<ellipse cx="67" cy="-79" rx="5" ry="4" fill="#3a2f33"/>' +
    '<circle cx="34" cy="-90" r="3" fill="#3a2415"/><path d="M28 -97 q6 -3 11 0" stroke="#3a2415" stroke-width="2" fill="none" stroke-linecap="round"/>' +
    '<g id="viento" stroke="#cfe6f5" stroke-width="4" stroke-linecap="round" fill="none">' +
      '<path d="M76 -86 q20 -4 40 0"/><path d="M78 -76 q24 0 48 4"/><path d="M76 -66 q20 4 40 8"/></g>' +
    '</g></g>';
}
function arbol(x, y, s, c) {
  return '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')">' +
    '<rect x="-7" y="-60" width="14" height="60" rx="4" fill="#8a6142"/>' +
    '<circle cx="0" cy="-78" r="34" fill="' + (c || "#7fb069") + '"/><circle cx="-22" cy="-62" r="22" fill="' + (c || "#7fb069") + '"/>' +
    '<circle cx="22" cy="-64" r="24" fill="' + (c || "#7fb069") + '"/><circle cx="-8" cy="-92" r="18" fill="#a3c98a" opacity=".6"/></g>';
}
function flores(x0, x1, y) {
  var s = "";
  for (var x = x0; x < x1; x += 37 + (x % 23)) {
    var c = ["#f6d860", "#f2a5c0", "#ffffff", "#b9a4e8"][x % 4];
    s += '<g class="pasto"><path d="M' + x + ' ' + y + ' q-2 -10 0 -16" stroke="#6a9a4f" stroke-width="2" fill="none"/>' +
         '<circle cx="' + x + '" cy="' + (y - 18) + '" r="4" fill="' + c + '"/></g>';
  }
  return s;
}
function nube(y, escala, dur, retraso) {
  return '<g class="nube" style="animation-duration:' + dur + 's; animation-delay:' + retraso + 's"><g transform="translate(0 ' + y + ') scale(' + escala + ')" fill="#fff" opacity=".85">' +
    '<ellipse cx="0" cy="0" rx="50" ry="18"/><circle cx="-20" cy="-10" r="20"/><circle cx="12" cy="-16" r="24"/></g></g>';
}

function dibujar() {
  var estrellas = "";
  for (var i = 0; i < 40; i++) estrellas += '<circle class="estrella" cx="' + ((i * 197) % 800) + '" cy="' + (10 + (i * 89) % 200) + '" r="' + (1 + (i % 3) * .6) + '" fill="#fff"/>';
  // casa de paja: un montoncito redondo, y briznas sueltas para cuando vuela
  var briznas = "";
  for (var b = 0; b < 26; b++) {
    briznas += '<path class="brizna" d="M' + (1215 + (b * 13) % 90) + ' ' + (270 - (b * 7) % 50) + ' l14 -4" stroke="#e2b84f" stroke-width="3" stroke-linecap="round" ' +
      'style="--dx:' + (80 + (b * 37) % 220) + 'px; --dy:' + (-60 - (b * 53) % 160) + 'px; --r:' + ((b * 47) % 360) + 'deg; animation-delay:' + ((b % 6) * .12) + 's"/>';
  }
  var palitos = "";
  for (var k = 0; k < 13; k++) {
    var px = 1995 + k * 9;
    palitos += '<rect class="palito" x="' + px + '" y="252" width="8" height="78" rx="3" fill="' + (k % 2 ? "#a0703f" : "#8d6033") + '" ' +
      'style="--caer:' + (k % 2 ? 84 : -84) + 'deg; transition-delay:' + (k * .07) + 's"/>';
  }
  var ladrillos = "";
  for (var fila = 0; fila < 7; fila++) {
    for (var col = 0; col < 8; col++) {
      var bx = 2770 + col * 20 + (fila % 2 ? 10 : 0);
      if (bx > 2915) continue;
      ladrillos += '<rect x="' + bx + '" y="' + (250 + fila * 11) + '" width="18" height="9" rx="1.5" fill="' + ((fila + col) % 3 ? "#c8573f" : "#b44a35") + '"/>';
    }
  }
  svg.innerHTML =
    '<defs>' +
      '<linearGradient id="dia" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9d8f0"/><stop offset="1" stop-color="#fdf1d8"/></linearGradient>' +
      '<linearGradient id="tarde" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3b58e"/><stop offset="1" stop-color="#fde3c3"/></linearGradient>' +
      '<linearGradient id="noche" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16213f"/><stop offset="1" stop-color="#3b4777"/></linearGradient>' +
      '<radialGradient id="luz" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe7a3" stop-opacity=".9"/><stop offset="1" stop-color="#ffe7a3" stop-opacity="0"/></radialGradient>' +
    '</defs>' +
    '<rect class="cielo" id="cDia" width="800" height="450" fill="url(#dia)"/>' +
    '<rect class="cielo" id="cTarde" width="800" height="450" fill="url(#tarde)" opacity="0"/>' +
    '<rect class="cielo" id="cNoche" width="800" height="450" fill="url(#noche)" opacity="0"/>' +
    '<g id="estrellas">' + estrellas + '</g>' +
    '<circle id="sol" cx="660" cy="80" r="34" fill="#ffd56b"/>' +
    '<g id="luna" opacity="0" transform="translate(0 80)"><circle cx="640" cy="70" r="26" fill="#f6f1d9"/><circle cx="652" cy="62" r="24" fill="#16213f" opacity=".9"/></g>' +
    nube(70, 1, 140, -20) + nube(120, .7, 170, -90) + nube(50, .8, 200, -150) +
    // lomas lejanas: se mueven más lento que el sendero (profundidad)
    '<g id="lomas">' +
      '<path d="M0 300 Q200 200 420 280 T860 260 T1300 270 T1760 250 T2200 280 L2200 450 L0 450 Z" fill="#a9cf8f" opacity=".75"/>' +
    '</g>' +
    '<g id="mundo">' +
      '<rect x="-400" y="300" width="4000" height="150" fill="#8cc06b"/>' +
      '<path d="M-400 352 C200 336 500 372 900 350 S1700 334 2100 356 S2900 344 3600 352 L3600 384 C2900 378 2500 392 2100 388 S1300 368 900 384 S200 372 -400 386 Z" fill="#e6cf9e"/>' +
      flores(-300, 3500, 412) + flores(-260, 3500, 330) +
      arbol(40, 320, 1, "#77a95f") + arbol(560, 318, .8) + arbol(960, 316, .9, "#86b86d") + arbol(1500, 318, 1.1, "#77a95f") +
      arbol(1760, 316, .85) + arbol(2280, 318, .95, "#86b86d") + arbol(2560, 316, .8) +
      // bosque al final del sendero, donde se va el lobo
      arbol(3120, 320, 1.2, "#5f8f4e") + arbol(3200, 312, 1, "#6b9c57") + arbol(3290, 322, 1.3, "#5f8f4e") + arbol(3380, 314, 1.1, "#6b9c57") +
      // casa de mamá
      '<g><rect x="200" y="250" width="120" height="80" rx="4" fill="#f3e2c3" stroke="#c9a77c" stroke-width="2"/>' +
      '<path d="M188 254 L260 200 L332 254 Z" fill="#c97b5a"/><rect x="246" y="284" width="28" height="46" rx="12" fill="#8a5a3b"/>' +
      '<rect x="212" y="268" width="24" height="20" rx="3" fill="#bfe1f2" stroke="#c9a77c" stroke-width="2"/>' +
      '<rect x="284" y="268" width="24" height="20" rx="3" fill="#bfe1f2" stroke="#c9a77c" stroke-width="2"/></g>' +
      '<g transform="translate(150 330)">' + chanchito("#c9a0dc").replace('<g>', '<g transform="scale(1.25)">') + '</g>' +
      // casa de paja
      '<g id="paja"><path d="M1200 330 Q1196 250 1260 240 Q1324 250 1320 330 Z" fill="#ebc65e" stroke="#c9a03d" stroke-width="2"/>' +
      '<path d="M1210 300 q50 -10 100 0 M1206 316 q54 -8 108 0 M1216 280 q44 -12 88 0 M1228 262 q32 -8 64 0" stroke="#c9a03d" stroke-width="2" fill="none"/>' +
      '<path d="M1248 330 v-30 a12 12 0 0 1 24 0 v30 z" fill="#8a6a2e"/></g>' +
      '<g id="briznas">' + briznas + '</g>' +
      // casa de palitos
      '<g id="palos">' + palitos +
      '<path id="techoPalos" d="M1982 256 L2050 206 L2120 256 Z" fill="#8d6033" stroke="#6e4a26" stroke-width="2"/></g>' +
      // casa de ladrillos, con chimenea y humo
      '<g><rect x="2770" y="244" width="150" height="86" fill="#d0654b" stroke="#9c4532" stroke-width="2"/>' + ladrillos +
      '<rect x="2880" y="180" width="22" height="50" fill="#b44a35" stroke="#9c4532" stroke-width="2"/>' +
      '<path d="M2756 250 L2845 186 L2934 250 Z" fill="#7a4a3a" stroke="#5e372b" stroke-width="2"/>' +
      '<circle class="humo" cx="2891" cy="176" r="10" fill="#e8e6e2"/><circle class="humo" cx="2891" cy="176" r="10" fill="#e8e6e2" style="animation-delay:2s"/>' +
      '<circle class="humo" cx="2891" cy="176" r="10" fill="#e8e6e2" style="animation-delay:4s"/>' +
      '<path d="M2790 330 v-44 a14 14 0 0 1 28 0 v44 z" fill="#a23b2f"/><circle cx="2812" cy="310" r="2.5" fill="#f2d16b"/>' +
      '<ellipse id="luzVentana" cx="2873" cy="282" rx="60" ry="46" fill="url(#luz)" opacity="0"/>' +
      '<rect x="2846" y="262" width="54" height="40" rx="4" fill="#fbe7a6" stroke="#9c4532" stroke-width="3"/>' +
      '<g id="caritas" opacity="0">' +
        [2857, 2873, 2889].map(function (cx) {
          return '<circle cx="' + cx + '" cy="290" r="8" fill="#f7b8c8" stroke="#e08ea6"/><ellipse cx="' + (cx + 1) + '" cy="292" rx="3.5" ry="2.6" fill="#f29bb3"/>' +
                 '<circle cx="' + (cx - 2) + '" cy="287" r="1.2" fill="#3a2415"/><circle cx="' + (cx + 3) + '" cy="287" r="1.2" fill="#3a2415"/>';
        }).join("") + '</g>' +
      '<path d="M2873 262 v40 M2846 282 h54" stroke="#9c4532" stroke-width="2.5"/></g>' +
      // plato de sopa para el lobo
      '<g id="sopa" opacity="0"><ellipse cx="2700" cy="356" rx="20" ry="7" fill="#f4f1ea" stroke="#b9b2a5" stroke-width="2"/>' +
        '<ellipse cx="2700" cy="354" rx="14" ry="4" fill="#e9a84a"/><path d="M2694 344 q4 -8 0 -14 M2704 344 q4 -8 0 -14" stroke="#e8e6e2" stroke-width="2" fill="none"/></g>' +
      '<g id="lobo" class="bicho oculto" transform="translate(500 358)">' + lobo() + '</g>' +
      '<g id="ch1" class="bicho respira" transform="translate(330 362)">' + chanchito("#f2c14e") + '</g>' +
      '<g id="ch2" class="bicho respira" transform="translate(270 366)">' + chanchito("#6fb3d8") + '</g>' +
      '<g id="ch3" class="bicho respira" transform="translate(390 366)">' + chanchito("#e06b5a") + '</g>' +
    '</g>';
}

/* ---------- escenas ----------
   Cada escena dice dónde va la cámara, cómo está el cielo y dónde está cada uno al
   empezar (antes). Los efectos pasan a medida que avanza la narración (en = qué
   fracción del audio). Saltar a una escena aplica todo de golpe, sin animar. */
var ESCENAS = [
  null,
  { cam: 0, cielo: "dia", antes: {} },
  { cam: 0, cielo: "dia", antes: {},
    efectos: [{ en: .75, ch: { ch1: 560, ch2: 500, ch3: 620 } }] },
  { cam: 800, cielo: "dia", antes: { ch: { ch1: 1150, ch2: 1050, ch3: 1100 } },
    efectos: [{ en: .55, ch: { ch2: 1450, ch3: 1520 } }] },
  { cam: 1600, cielo: "dia", antes: { ch: { ch2: 1950, ch3: 2200 } },
    efectos: [{ en: .6, ch: { ch3: 2330 } }] },
  { cam: 2400, cielo: "dia", antes: { ch: { ch3: 2740 } } },
  { cam: 800, cielo: "tarde", antes: { lobo: { x: 760, ver: true }, ch: { ch1: 1150 } },
    efectos: [{ en: .02, lobo: { x: 1060 } }, { en: .55, sopla: true }, { en: .66, paja: true }, { en: .8, sopla: false },
              { en: .85, ch: { ch1: 1920 }, rapido: true }] },
  { cam: 1600, cielo: "tarde", antes: { lobo: { x: 1560 }, ch: { ch1: 1920, ch2: 1950 } },
    efectos: [{ en: .02, lobo: { x: 1840 } }, { en: .45, sopla: true }, { en: .55, palos: true }, { en: .72, sopla: false },
              { en: .78, ch: { ch1: 2740, ch2: 2700 }, rapido: true }] },
  { cam: 2400, cielo: "tarde", antes: { lobo: { x: 2380 }, ch: { ch1: 2800, ch2: 2800, ch3: 2800 }, dentro: true },
    efectos: [{ en: .02, lobo: { x: 2640 } }, { en: .5, sopla: true }, { en: .82, sopla: false }, { en: .88, sentado: true }] },
  { cam: 2400, cielo: "tarde", antes: { lobo: { x: 2640 }, sentado: true, dentro: true },
    efectos: [{ en: .4, sopa: true }, { en: .7, sentado: false }, { en: .78, sopa: false, lobo: { x: 3400 } }] },
  { cam: 2400, cielo: "noche", antes: { lobo: { x: 3400, ver: false }, dentro: true, luz: true } }
];

var bichos = {};
function mover(id, x, rapido, sinAnimar) {
  var el = bichos[id];
  var y = id === "lobo" ? 358 : (id === "ch1" ? 362 : 366);
  el.classList.toggle("rapido", !!rapido);
  if (sinAnimar) { el.style.transition = "none"; void el.getBBox(); }
  var antes = el._x;
  el.setAttribute("transform", "translate(" + x + " " + y + ")");
  el.style.transform = "translate(" + x + "px," + y + "px)";
  el._x = x;
  if (sinAnimar) { void el.getBBox(); el.style.transition = ""; return; }
  if (antes !== x) {
    el.classList.add("camina"); el.classList.remove("respira");
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove("camina"); el.classList.add("respira"); }, rapido ? 1800 : 3200);
  }
}
function aplicar(e, sinAnimar) {
  if (e.ch) Object.keys(e.ch).forEach(function (id) { mover(id, e.ch[id], e.rapido, sinAnimar); });
  if (e.lobo) {
    if (e.lobo.ver !== undefined) bichos.lobo.classList.toggle("oculto", !e.lobo.ver);
    else bichos.lobo.classList.remove("oculto");
    if (e.lobo.x !== undefined) mover("lobo", e.lobo.x, false, sinAnimar);
  }
  if (e.sopla !== undefined) bichos.lobo.classList.toggle("soplando", e.sopla);
  if (e.sentado !== undefined) bichos.lobo.classList.toggle("sentado", e.sentado);
  if (e.paja) { $("#paja").classList.add("volada"); if (!sinAnimar) $("#briznas").classList.add("volando"); }
  if (e.palos) $("#palos").classList.add("caida");
  if (e.dentro !== undefined) {
    ["ch1", "ch2", "ch3"].forEach(function (id) { bichos[id].classList.toggle("oculto", e.dentro); });
    $("#caritas").setAttribute("opacity", e.dentro ? 1 : 0);
  }
  if (e.sopa !== undefined) $("#sopa").setAttribute("opacity", e.sopa ? 1 : 0);
  if (e.luz) $("#luzVentana").setAttribute("opacity", 1);
}
function cielo(c) {
  $("#cTarde").setAttribute("opacity", c === "tarde" ? 1 : 0);
  $("#cNoche").setAttribute("opacity", c === "noche" ? 1 : 0);
  $("#sol").style.transform = c === "noche" ? "translateY(320px)" : c === "tarde" ? "translateY(90px)" : "";
  $("#luna").setAttribute("opacity", c === "noche" ? 1 : 0);
  $("#luna").style.transform = c === "noche" ? "translateY(0)" : "translateY(80px)";
  svg.classList.toggle("noche", c === "noche");
}
function camara(x, sinAnimar) {
  var m = $("#mundo"), l = $("#lomas");
  if (sinAnimar) { m.style.transition = l.style.transition = "none"; }
  m.style.transform = "translateX(" + (-x) + "px)";
  l.style.transform = "translateX(" + (-x * .4) + "px)";
  if (sinAnimar) { void svg.getBBox(); m.style.transition = l.style.transition = ""; }
}
// Estado inicial y estado final de cada escena, sumando todo lo anterior
function reiniciarDibujo() {
  dibujar();
  ["lobo", "ch1", "ch2", "ch3"].forEach(function (id) { bichos[id] = $("#" + id); bichos[id]._x = null; });
  mover("ch1", 330, false, true); mover("ch2", 270, false, true); mover("ch3", 390, false, true); mover("lobo", 500, false, true);
}
function irSinAnimar(n) {
  reiniciarDibujo();
  for (var i = 1; i < n; i++) {
    aplicar(ESCENAS[i].antes, true);
    (ESCENAS[i].efectos || []).forEach(function (f) { aplicar(f, true); });
  }
  aplicar(ESCENAS[n].antes, true);
  camara(ESCENAS[n].cam, true);
  cielo(ESCENAS[n].cielo);
}

/* ---------- narración ---------- */
var textos = {}, audios = {}, audio = new Audio(), actual = 0, pausado = false, token = 0;
var synth = window.speechSynthesis;
function leerTextos(t) {
  var p = {}, a = null;
  t.split(/\r?\n/).forEach(function (l) {
    var m = l.match(/^==\s*(\d+)\s*$/);
    if (m) { a = +m[1]; p[a] = []; return; }
    if (a === null || /^#/.test(l) || !l.trim()) return;
    p[a].push(l.trim());
  });
  return p;
}
var listo = Promise.all([
  fetch("../textos/tres-chanchitos.txt").then(function (r) { return r.text(); }).then(function (t) { textos = leerTextos(t); }),
  fetch("../audio/tres-chanchitos/indice.json").then(function (r) { return r.ok ? r.json() : {}; })
    .then(function (j) { audios = j.paginas || {}; }).catch(function () {})
]);

function mostrarTexto(n) {
  $("#texto").innerHTML = (textos[n] || []).map(function (t) {
    return "<p>" + t.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</p>";
  }).join("");
}
// Progreso de la narración (0 a 1): con audio grabado, por el tiempo del audio;
// con la voz del navegador, por lo que lleva dicho
var habla = { inicio: 0, dur: 1, pausaDesde: 0 };
function progreso() {
  if (audios[actual]) return audio.duration ? audio.currentTime / audio.duration : 0;
  var ahora = pausado ? habla.pausaDesde : performance.now();
  return Math.min(1, (ahora - habla.inicio) / habla.dur);
}
function vozNavegador() {
  var es = synth ? synth.getVoices().filter(function (v) { return /^es/i.test(v.lang); }) : [];
  return es.filter(function (v) { return /paulina|sabina|dalia|elena|helena|laura|valentina|google español/i.test(v.name); })[0] || es[0] || null;
}
function narrar(n, t) {
  return new Promise(function (fin) {
    if (audios[n]) {
      audio.src = "../audio/tres-chanchitos/p" + (n < 10 ? "0" : "") + n + ".mp3";
      audio.onended = function () { fin(); };
      audio.onerror = function () { delete audios[n]; narrar(n, t).then(fin); };
      var p = audio.play(); if (p && p.catch) p.catch(function () {});
      return;
    }
    var frases = (textos[n] || []), v = vozNavegador(), quedan = frases.length;
    habla.inicio = performance.now(); habla.dur = Math.max(2000, frases.join(" ").length * 75);
    if (!synth || !quedan) { setTimeout(fin, habla.dur); return; }
    frases.forEach(function (f) {
      var u = new SpeechSynthesisUtterance(f);
      if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "es-419";
      u.rate = .85; u.pitch = 1;
      u.onend = u.onerror = function () { if (--quedan <= 0 && t === token) fin(); };
      synth.speak(u);
    });
  });
}
function esperar(ms, t) {
  return new Promise(function (r) {
    (function mirar() {
      if (t !== token) return;
      if (pausado || ms > 0) { if (!pausado) ms -= 100; setTimeout(mirar, 100); } else r();
    })();
  });
}
// Una escena: mueve la cámara, espera que llegue, narra y va disparando los efectos
function escena(n) {
  var t = ++token, e = ESCENAS[n];
  actual = n;
  callar();
  aplicar(e.antes);
  camara(e.cam);
  cielo(e.cielo);
  mostrarTexto(n);
  var pendientes = (e.efectos || []).slice();
  (function efectos() {
    if (t !== token) return;
    var p = progreso();
    while (pendientes.length && pendientes[0].en <= p) aplicar(pendientes.shift());
    requestAnimationFrame(efectos);
  })();
  return esperar(n === 1 ? 1200 : 3600, t).then(function () { return t === token && narrar(n, t); })
    .then(function () { if (t !== token) return; pendientes.forEach(function (f) { aplicar(f); }); pendientes = []; })
    .then(function () { return esperar(2200, t); })
    .then(function () { if (t === token && n < 10) escena(n + 1); else if (t === token) fin(); });
}
function callar() {
  audio.onended = audio.onerror = null; audio.pause();
  if (synth) synth.cancel();
}
function fin() {
  ponerPausa(true);
  $("#texto").innerHTML = "";
}
function ponerPausa(si) {
  pausado = si;
  $("#pausa").innerHTML = si ? '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>' : '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
  $("#pausa").setAttribute("aria-label", si ? "Seguir" : "Pausar");
  if (si) { habla.pausaDesde = performance.now(); audio.pause(); if (synth) synth.pause(); }
  else { habla.inicio += performance.now() - (habla.pausaDesde || performance.now()); if (audios[actual] && audio.src && audio.currentTime) audio.play(); if (synth) synth.resume(); }
}
function saltar(n) {
  n = Math.max(1, Math.min(10, n));
  token++; callar();
  irSinAnimar(n);
  ponerPausa(false);
  escena(n);
}

$("#contar").addEventListener("click", function () {
  // el audio tiene que arrancar dentro del toque (iPad, Chrome)
  audio.play().catch(function () {}); audio.pause();
  $("#inicio").classList.add("fuera");
  ponerPausa(false);
  listo.then(function () { escena(1); });
});
$("#pausa").addEventListener("click", function () {
  if (!actual) return;
  if (pausado && actual === 10 && !$("#texto").innerHTML) { saltar(1); return; }   // terminó: empieza de nuevo
  ponerPausa(!pausado);
});
$("#atras").addEventListener("click", function () { if (actual) saltar(actual - 1); });
// El texto es para el adulto: oculto de entrada para que no tape los dibujos
$("#verTexto").addEventListener("click", function () {
  var si = document.body.classList.toggle("con-texto");
  this.setAttribute("aria-label", si ? "Ocultar el texto" : "Mostrar el texto");
  this.title = this.getAttribute("aria-label");
});
$("#adelante").addEventListener("click", function () { if (actual) saltar(actual + 1); });

reiniciarDibujo();
camara(0, true); cielo("dia");
ponerPausa(true);
})();
</script>
