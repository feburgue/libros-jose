<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Los tres chanchitos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1a0f">
<link rel="shortcut icon" type="image/png" href="../favicon.ico">
<!-- Mapa y personajes pintados con Nano Banana (Gemini) a partir de textos de
     Claude; animación con GSAP 3.12.5 (cerditos/lib, licencia estándar de GSAP). -->
<script src="lib/gsap.min.js"></script>
<style>
  :root{ --crema:#fff6e7; --ambar:#f2a567; --tinta:#3a2415 }
  html,body{margin:0; height:100%; overflow:hidden; background:#5d7d4a; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none}
  /* de fondo, el mismo mapa difuminado, para cuando la vista es más ancha que el mapa */
  #fondo{position:fixed; inset:-40px; background:url(img/mapa.jpg) center/cover; filter:blur(24px) brightness(.85)}
  #vista{position:fixed; inset:0; overflow:hidden}
  #mundo{position:absolute; left:0; top:0; width:1536px; height:2752px; transform-origin:0 0; will-change:transform}
  #mapa{position:absolute; inset:0; width:100%; height:100%}
  .pieza{position:absolute; left:0; top:0; will-change:transform}
  .pieza img{position:absolute; display:block; pointer-events:none}
  /* tarde y noche: un velo de color sobre todo el mundo */
  #tarde, #noche{position:absolute; inset:0; pointer-events:none; opacity:0}
  #tarde{background:linear-gradient(#ffb27a, #ffcf9a 40%, #ffd9a8); mix-blend-mode:multiply}
  #noche{background:linear-gradient(#0f1a3d, #26346a 30%, #2c3a70); mix-blend-mode:multiply}
  .estrella{position:absolute; width:6px; height:6px; border-radius:50%; background:#fff8dc; box-shadow:0 0 8px #fff3b0; opacity:0}
  #luna{position:absolute; left:1240px; top:70px; width:110px; height:110px; border-radius:50%; background:#fbf3d0;
    box-shadow:0 0 50px 12px rgba(255,244,190,.45); opacity:0}
  #luz{position:absolute; left:960px; top:2180px; width:240px; height:240px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,226,140,.95) 0%, rgba(255,214,120,.5) 30%, rgba(255,214,120,0) 68%); opacity:0; mix-blend-mode:screen}
  /* los chanchitos asomados a la ventana de la casa de ladrillos */
  #ventana{position:absolute; left:1042px; top:2262px; width:66px; height:56px; overflow:hidden; opacity:0}
  #ventana img{position:absolute; top:4px; height:110px}
  .humo{position:absolute; width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.75); filter:blur(4px); opacity:0}
  /* paja que vuela cuando sopla el lobo */
  .brizna{position:absolute; width:26px; height:5px; border-radius:3px; background:#e4bd5a; opacity:0}
  #texto{position:fixed; left:50%; bottom:max(12px, env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(880px, calc(100% - 24px));
    background:rgba(255,248,236,.9); color:var(--tinta); border-radius:16px; padding:10px 16px; box-shadow:0 4px 18px rgba(0,0,0,.25);
    font:15px/1.4 Georgia,'Times New Roman',serif; max-height:32vh; overflow:auto; transition:opacity .6s}
  #texto:empty, body:not(.con-texto) #texto{opacity:0; pointer-events:none}
  #texto p{margin:0 0 3px}
  #controles{position:fixed; top:max(10px, env(safe-area-inset-top)); right:12px; display:flex; gap:8px; z-index:3}
  #controles button, #controles a{all:unset; cursor:pointer; width:42px; height:42px; border-radius:12px; display:grid; place-items:center;
    background:rgba(42,26,15,.55); color:var(--crema); backdrop-filter:blur(6px); font:700 16px/1 Georgia,serif}
  #controles svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  #pausa svg{fill:currentColor; stroke:none}
  body.con-texto #verTexto{background:rgba(242,165,103,.92); color:var(--tinta)}
  #inicio{position:fixed; inset:0; display:grid; place-items:center; background:rgba(27,20,16,.35); transition:opacity 1s; z-index:4}
  #inicio.fuera{opacity:0; pointer-events:none}
  #inicio .caja{text-align:center; color:var(--crema)}
  #inicio h1{margin:0 0 18px; font:bold clamp(30px,6vw,56px)/1.1 Georgia,serif; text-shadow:0 3px 14px rgba(0,0,0,.55)}
  #contar{all:unset; cursor:pointer; background:var(--ambar); color:var(--tinta); font:600 20px/1 system-ui,sans-serif; padding:16px 28px; border-radius:40px;
    box-shadow:0 6px 20px rgba(0,0,0,.35); display:inline-flex; align-items:center; gap:10px}
  #contar svg{width:22px; height:22px; fill:currentColor}
  @media (max-height:430px){ #texto{font-size:13px; padding:7px 12px; max-height:28vh} }
</style>
</head>
<body>
<div id="fondo"></div>
<div id="vista">
  <div id="mundo">
    <img id="mapa" src="img/mapa.jpg" alt="">
  </div>
</div>
<div id="texto" aria-live="polite"></div>
<div id="controles">
  <a href="../index.html" aria-label="Volver a los libros" title="Todos los libros"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></a>
  <button id="verTexto" aria-label="Mostrar el texto" title="Mostrar el texto">Aa</button>
  <button id="atras" aria-label="Escena anterior" title="Anterior"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
  <button id="pausa" aria-label="Pausar" title="Pausar"></button>
  <button id="adelante" aria-label="Escena siguiente" title="Siguiente"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
</div>
<div id="inicio"><div class="caja">
  <h1>Los tres chanchitos</h1>
  <button id="contar"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>Contar el cuento</button>
</div></div>

<script>
(function () {
"use strict";
var $ = function (s) { return document.querySelector(s); };
var mundo = $("#mundo"), vista = $("#vista");

/* ---------- el mapa ----------
   Todo está en coordenadas del dibujo del mapa (1536 x 2752). El sendero, de la
   casa de mamá (arriba) a la de ladrillos y el bosque (abajo): */
var SENDERO = [[660,690],[790,730],[790,800],[640,860],[470,910],[470,960],[600,1000],[740,1040],[720,1120],[600,1200],
  [560,1260],[600,1320],[700,1350],[820,1380],[940,1410],[930,1480],[780,1560],[620,1600],[580,1660],[620,1720],
  [780,1770],[960,1800],[1040,1840],[960,1920],[660,2000],[400,2060],[220,2160],[180,2260],[280,2340],[500,2400],
  [720,2460],[900,2540],[1120,2640],[1300,2760]];
var PASO = { casaMama: 0, paja: 7, palos: 20, ladrillos: 30, bosque: 33 };

// Piezas: dibujo, alto en el mapa y dónde va (los personajes, por los pies)
function pieza(id, src, alto, x, y, base) {
  var d = document.createElement("div");
  d.className = "pieza"; d.id = id;
  d.innerHTML = '<div class="giro"><div class="cuerpo"><img alt="" src="img/' + src + '"></div></div>';
  mundo.appendChild(d);
  var img = d.querySelector("img");
  img.style.height = alto + "px";
  img.onload = function () {
    var ancho = alto * img.naturalWidth / img.naturalHeight;
    img.style.width = ancho + "px";
    img.style.left = (base ? 0 : -ancho / 2) + "px";
    img.style.top = (base ? 0 : -alto) + "px";
  };
  gsap.set(d, { x: x, y: y });
  return d;
}
var P = {};
function armar() {
  mundo.querySelectorAll(".pieza, .estrella, .humo, .brizna, #tarde, #noche, #luna, #luz, #ventana").forEach(function (e) { e.remove(); });
  // las casitas que se caen van sobre el mapa (que ya no las tiene dibujadas)
  P.paja = pieza("paja", "casa-paja.webp", 390, 840, 700, true);
  P.palos = pieza("palos", "casa-palos.webp", 430, 920, 1400, true);
  P.pajaSuelta = pieza("pajaSuelta", "paja-suelta.webp", 150, 1030, 1075);
  P.palitos = pieza("palitos", "palitos.webp", 210, 1150, 1830);
  gsap.set([P.pajaSuelta, P.palitos], { autoAlpha: 0 });
  P.mama = pieza("mama", "mama.webp", 190, 470, 725);
  P.ch1 = pieza("ch1", "ch-amarillo.webp", 150, 560, 735);
  P.ch2 = pieza("ch2", "ch-azul.webp", 150, 620, 745);
  P.ch3 = pieza("ch3", "ch-rojo.webp", 150, 690, 740);
  P.lobo = pieza("lobo", "lobo-camina.webp", 235, 420, 900);
  gsap.set(P.lobo, { autoAlpha: 0 });
  // tres caritas en la ventana
  var v = document.createElement("div"); v.id = "ventana";
  v.innerHTML = '<img src="img/ch-amarillo.webp" style="left:-26px"><img src="img/ch-azul.webp" style="left:-4px"><img src="img/ch-rojo.webp" style="left:18px">';
  mundo.appendChild(v);
  ["tarde", "noche"].forEach(function (id) { var d = document.createElement("div"); d.id = id; mundo.appendChild(d); });
  for (var i = 0; i < 60; i++) {
    var e = document.createElement("div"); e.className = "estrella";
    e.style.left = ((i * 263) % 1500 + 18) + "px"; e.style.top = (14 + (i * 97) % 300) + "px";
    mundo.appendChild(e);
  }
  var luna = document.createElement("div"); luna.id = "luna"; mundo.appendChild(luna);
  var luz = document.createElement("div"); luz.id = "luz"; mundo.appendChild(luz);
  // humito de las chimeneas, que sube despacio todo el tiempo
  [[575, 300], [1196, 1960]].forEach(function (c, k) {
    for (var j = 0; j < 3; j++) {
      var h = document.createElement("div"); h.className = "humo"; mundo.appendChild(h);
      gsap.fromTo(h, { x: c[0], y: c[1], scale: .4, opacity: 0 },
        { x: c[0] + 40, y: c[1] - 130, scale: 1.6, keyframes: { opacity: [0, .7, 0] }, duration: 7, repeat: -1, delay: j * 2.3 + k, ease: "sine.out" });
    }
  });
  for (var b = 0; b < 30; b++) { var z = document.createElement("div"); z.className = "brizna"; mundo.appendChild(z); }
  // todos respiran tranquilos cuando están quietos
  Object.keys(P).forEach(function (k) {
    if (/^(ch|mama|lobo)/.test(k)) gsap.to(P[k].querySelector(".cuerpo"), { scaleY: 1.03, transformOrigin: "50% 100%", duration: 1.8, yoyo: true, repeat: -1, ease: "sine.inOut", delay: Math.random() });
  });
}

/* ---------- la cámara ----------
   cam = punto del mapa que va al centro y cuánto mapa entra de alto */
var cam = { x: 768, y: 1376, alto: 2752 };
function aplicarCamara() {
  var vw = vista.clientWidth, vh = vista.clientHeight;
  var s = vh / cam.alto;
  var x = vw / 2 - cam.x * s, y = vh / 2 - cam.y * s;
  // si el mapa cubre la pantalla, que no se vea el borde
  if (1536 * s >= vw) x = Math.min(0, Math.max(vw - 1536 * s, x)); else x = (vw - 1536 * s) / 2;
  if (2752 * s >= vh) y = Math.min(0, Math.max(vh - 2752 * s, y));
  mundo.style.transform = "translate(" + x + "px," + y + "px) scale(" + s + ")";
}
function camara(x, y, alto, dur) {
  gsap.killTweensOf(cam);
  if (!dur) { cam.x = x; cam.y = y; cam.alto = alto; aplicarCamara(); return; }
  gsap.to(cam, { x: x, y: y, alto: alto, duration: dur, ease: "sine.inOut", onUpdate: aplicarCamara });
}
window.addEventListener("resize", aplicarCamara);

/* ---------- caminar por el sendero ---------- */
function pos(el) { return [gsap.getProperty(el, "x"), gsap.getProperty(el, "y")]; }
// Recorre el sendero desde el punto más cercano hasta el paso "hasta" y termina en "fin"
function caminar(el, hasta, fin, rapido, tl, en) {
  var p = pos(el), desde = 0, mejor = Infinity;
  SENDERO.forEach(function (q, i) { var d = Math.hypot(q[0] - p[0], q[1] - p[1]); if (d < mejor) { mejor = d; desde = i; } });
  var puntos = [];
  if (desde <= hasta) for (var i = desde; i <= hasta; i++) puntos.push(SENDERO[i]);
  else for (var j = desde; j >= hasta; j--) puntos.push(SENDERO[j]);
  if (fin) puntos.push(fin);
  var vel = rapido ? 300 : 150, t = en || 0, ant = p;
  var cuerpo = el.querySelector(".cuerpo"), giro = el.querySelector(".giro");
  var duracion = 0;
  puntos.forEach(function (q) {
    var d = Math.hypot(q[0] - ant[0], q[1] - ant[1]);
    if (d < 1) return;
    var dt = d / vel;
    tl.to(giro, { scaleX: q[0] < ant[0] - 2 ? -1 : 1, duration: .25 }, t);
    tl.to(el, { x: q[0], y: q[1], duration: dt, ease: "none" }, t);
    t += dt; duracion += dt; ant = q;
  });
  // saltitos al caminar
  if (duracion > 0) tl.to(cuerpo, { y: -8, duration: rapido ? .14 : .22, yoyo: true, repeat: Math.max(1, Math.round(duracion / (rapido ? .14 : .22)) | 1), ease: "sine.inOut" }, en || 0);
  return duracion;
}
function cambiarDibujo(el, src) { el.querySelector("img").src = "img/" + src; }

/* ---------- efectos ---------- */
function soplar(el, si) { cambiarDibujo(el, si ? "lobo-sopla.webp" : "lobo-camina.webp"); }
function volarPaja() {
  gsap.to(P.paja, { x: "+=260", y: "-=320", rotation: 30, scale: .35, autoAlpha: 0, duration: 3.2, ease: "power1.in", transformOrigin: "50% 100%" });
  gsap.to(P.pajaSuelta, { autoAlpha: 1, duration: 1.5, delay: 1 });
  mundo.querySelectorAll(".brizna").forEach(function (z, i) {
    gsap.fromTo(z, { x: 900 + (i * 17) % 220, y: 820 + (i * 29) % 220, rotation: i * 37, opacity: 1 },
      { x: "+=" + (220 + (i * 41) % 380), y: "-=" + (120 + (i * 53) % 420), rotation: "+=" + (180 + i * 20), opacity: 0, duration: 3 + (i % 5) * .4, delay: (i % 6) * .12, ease: "power1.out" });
  });
}
function caerPalos() {
  gsap.to(P.palos, { scaleY: .15, scaleX: 1.15, autoAlpha: 0, y: "+=40", transformOrigin: "50% 100%", duration: 1.8, ease: "power2.in" });
  gsap.to(P.palitos, { autoAlpha: 1, duration: 1.2, delay: .8 });
}
function cielo(c, dur) {
  gsap.to("#tarde", { opacity: c === "tarde" ? .55 : 0, duration: dur });
  gsap.to("#noche", { opacity: c === "noche" ? .78 : 0, duration: dur });
  gsap.to(".estrella", { opacity: c === "noche" ? 1 : 0, duration: dur, stagger: dur ? .05 : 0 });
  gsap.to("#luna", { opacity: c === "noche" ? 1 : 0, duration: dur });
  // el fondo de los costados también cambia con la hora
  gsap.to("#fondo", { filter: "blur(24px) brightness(" + (c === "noche" ? .3 : c === "tarde" ? .7 : .85) + ")", duration: dur });
}

/* ---------- escenas ----------
   cam: [x, y, alto]; cielo; arranque(tl): lo que pasa al llegar; efectos: lo que
   pasa a medida que avanza la narración (en = fracción del audio). */
var LADO = { paja: [850, 1060], palos: [905, 1795], ladrillos: [840, 2420], puerta: [930, 2385],
             loboPaja: [700, 1050], loboPalos: [770, 1800], loboLadrillos: [650, 2450] };
function entrar(el) { gsap.to(el, { autoAlpha: 0, duration: 1 }); }
var ESCENAS = [null,
  { cam: [768, 1376, 2752], cielo: "dia" },
  { cam: [640, 660, 620], cielo: "dia",
    efectos: [{ en: .7, hacer: function (tl) { caminar(P.ch1, 3, null, false, tl); caminar(P.ch2, 3, null, false, tl, .5); caminar(P.ch3, 3, null, false, tl, 1); } }] },
  { cam: [840, 990, 620], cielo: "dia",
    arranque: function (tl) { caminar(P.ch1, PASO.paja, LADO.paja, false, tl); caminar(P.ch2, PASO.paja - 1, null, false, tl); caminar(P.ch3, PASO.paja - 2, null, false, tl); },
    efectos: [{ en: .6, hacer: function (tl) { caminar(P.ch2, 12, null, false, tl); caminar(P.ch3, 12, null, false, tl, .6); } }] },
  { cam: [960, 1690, 640], cielo: "dia",
    arranque: function (tl) { caminar(P.ch2, PASO.palos, LADO.palos, false, tl); caminar(P.ch3, PASO.palos + 1, null, false, tl, .5); },
    efectos: [{ en: .62, hacer: function (tl) { caminar(P.ch3, 26, null, false, tl); } }] },
  { cam: [940, 2320, 660], cielo: "dia",
    arranque: function (tl) { caminar(P.ch3, PASO.ladrillos, LADO.ladrillos, false, tl); } },
  { cam: [840, 990, 620], cielo: "tarde",
    arranque: function (tl) { gsap.set(P.lobo, { autoAlpha: 1 }); caminar(P.lobo, PASO.paja, LADO.loboPaja, false, tl); },
    efectos: [{ en: .5, hacer: function () { soplar(P.lobo, true); } }, { en: .62, hacer: volarPaja },
              { en: .78, hacer: function () { soplar(P.lobo, false); } },
              { en: .84, hacer: function (tl) { caminar(P.ch1, PASO.palos, [985, 1805], true, tl); } }] },
  { cam: [960, 1690, 640], cielo: "tarde",
    arranque: function (tl) { caminar(P.lobo, PASO.palos, LADO.loboPalos, false, tl); },
    efectos: [{ en: .42, hacer: function () { soplar(P.lobo, true); } }, { en: .52, hacer: caerPalos },
              { en: .7, hacer: function () { soplar(P.lobo, false); } },
              { en: .76, hacer: function (tl) { caminar(P.ch1, PASO.ladrillos, LADO.puerta, true, tl); caminar(P.ch2, PASO.ladrillos, LADO.puerta, true, tl, .3); } }] },
  { cam: [900, 2330, 660], cielo: "tarde",
    arranque: function (tl) {
      [P.ch1, P.ch2, P.ch3].forEach(entrar); gsap.to("#ventana", { opacity: 1, duration: 1.5, delay: .8 });
      caminar(P.lobo, PASO.ladrillos - 1, LADO.loboLadrillos, false, tl);
    },
    efectos: [{ en: .48, hacer: function () { soplar(P.lobo, true); } },
              { en: .55, hacer: function () { gsap.fromTo(P.lobo.querySelector(".cuerpo"), { x: -3 }, { x: 3, duration: .12, yoyo: true, repeat: 15 }); } },
              { en: .8, hacer: function () { soplar(P.lobo, false); } },
              { en: .87, hacer: function () { cambiarDibujo(P.lobo, "lobo-cansado.webp"); } }] },
  { cam: [900, 2330, 660], cielo: "tarde",
    efectos: [{ en: .38, hacer: function () { cambiarDibujo(P.lobo, "lobo-sentado.webp"); } },
              { en: .72, hacer: function (tl) { cambiarDibujo(P.lobo, "lobo-camina.webp"); caminar(P.lobo, PASO.bosque, null, false, tl); gsap.to(P.lobo, { autoAlpha: 0, duration: 2, delay: 6 }); } }] },
  { cam: [900, 2330, 660], cielo: "noche",
    arranque: function () { gsap.to("#luz", { opacity: 1, duration: 4 }); gsap.set(P.lobo, { autoAlpha: 0 }); },
    efectos: [{ en: .15, hacer: function () { camara(768, 1376, 2752, 26); } }] }
];
// Saltar a una escena: se arma todo como quedó al final de las anteriores, sin animar
function irDirecto(n) {
  gsap.globalTimeline.getChildren(false, true, true).forEach(function (t) { if (!t.vars.repeat) t.kill(); });
  armar();
  var tl = gsap.timeline({ paused: true });
  for (var i = 1; i < n; i++) {
    var e = ESCENAS[i];
    if (e.arranque) e.arranque(tl);
    (e.efectos || []).forEach(function (f) { f.hacer(tl); });
  }
  tl.progress(1).kill();
  gsap.globalTimeline.getChildren(false, true, false).forEach(function (t) { if (!t.vars.repeat) t.progress(1); });
  cielo(ESCENAS[n].cielo, 0);
  var c = ESCENAS[n].cam; camara(c[0], c[1], c[2], 0);
}

/* ---------- narración ---------- */
var textos = {}, audios = {}, audio = new Audio(), actual = 0, pausado = true, token = 0;
var synth = window.speechSynthesis, habla = { inicio: 0, dur: 1, pausaDesde: 0 };
// escena cuya narración ya arrancó: antes de eso, el audio es todavía el de la escena anterior
var narrando = 0;
function leerTextos(t) {
  var p = {}, a = null;
  t.split(/\r?\n/).forEach(function (l) {
    var m = l.match(/^==\s*(\d+)\s*$/);
    if (m) { a = +m[1]; p[a] = []; return; }
    if (a === null || /^#/.test(l) || !l.trim()) return;
    p[a].push(l.trim());
  });
  return p;
}
var listo = Promise.all([
  fetch("../textos/tres-chanchitos.txt").then(function (r) { return r.text(); }).then(function (t) { textos = leerTextos(t); }),
  fetch("../audio/tres-chanchitos/indice.json").then(function (r) { return r.ok ? r.json() : {}; })
    .then(function (j) { audios = j.paginas || {}; }).catch(function () {})
]);
function mostrarTexto(n) {
  $("#texto").innerHTML = (textos[n] || []).map(function (t) { return "<p>" + t.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</p>"; }).join("");
}
function progreso() {
  if (narrando !== actual) return 0;
  if (audios[actual]) return audio.duration ? audio.currentTime / audio.duration : 0;
  return Math.min(1, ((pausado ? habla.pausaDesde : performance.now()) - habla.inicio) / habla.dur);
}
function vozNavegador() {
  var es = synth ? synth.getVoices().filter(function (v) { return /^es/i.test(v.lang); }) : [];
  return es.filter(function (v) { return /paulina|sabina|dalia|elena|helena|laura|valentina|google español/i.test(v.name); })[0] || es[0] || null;
}
function narrar(n, t) {
  narrando = n;
  return new Promise(function (fin) {
    if (audios[n]) {
      audio.src = "../audio/tres-chanchitos/p" + (n < 10 ? "0" : "") + n + ".mp3";
      audio.onended = function () { fin(); };
      audio.onerror = function () { delete audios[n]; narrar(n, t).then(fin); };
      var p = audio.play(); if (p && p.catch) p.catch(function () {});
      return;
    }
    var frases = textos[n] || [], v = vozNavegador(), quedan = frases.length;
    habla.inicio = performance.now(); habla.dur = Math.max(2000, frases.join(" ").length * 75);
    if (!synth || !quedan) { setTimeout(fin, habla.dur); return; }
    frases.forEach(function (f) {
      var u = new SpeechSynthesisUtterance(f);
      if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "es-419";

function esperar(ms, t) {

function callar() { narrando = 0; audio.onended = audio.onerror = null; audio.pause(); if (synth) synth.cancel(); }

// Una escena: la cámara viaja, pasa lo de la llegada, se narra y van saliendo los efectos
function escena(n) {
  var t = ++token, e = ESCENAS[n];
  actual = n;
  callar();
  var c = e.cam; camara(c[0], c[1], c[2], n === 1 ? 0 : 4.5);
  cielo(e.cielo, 5);
  mostrarTexto(n);
  var tl = gsap.timeline();
  if (e.arranque) e.arranque(tl);
  var pendientes = (e.efectos || []).slice();
  (function efectos() {
    if (t !== token) return;
    var p = progreso();
    while (pendientes.length && pendientes[0].en <= p) pendientes.shift().hacer(gsap.timeline());
    requestAnimationFrame(efectos);
  })();
  return esperar(n === 1 ? 1500 : 4000, t).then(function () { return t === token && narrar(n, t); })
    .then(function () { if (t !== token) return; pendientes.forEach(function (f) { f.hacer(gsap.timeline()); }); pendientes = []; })

}
function ponerPausa(si, terminado) {
  pausado = si;
  $("#pausa").innerHTML = si ? '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>' : '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
  $("#pausa").setAttribute("aria-label", si ? "Seguir" : "Pausar");
  $("#pausa").dataset.terminado = terminado ? "1" : "";

  if (si) { habla.pausaDesde = performance.now(); audio.pause(); if (synth) synth.pause(); }
  else { habla.inicio += performance.now() - (habla.pausaDesde || performance.now()); if (audios[actual] && audio.src && audio.currentTime) audio.play(); if (synth) synth.resume(); }
}
function saltar(n) {
  n = Math.max(1, Math.min(10, n));
  token++; callar();
  irDirecto(n);
  ponerPausa(false);
  escena(n);
}

$("#contar").addEventListener("click", function () {
  audio.play().catch(function () {}); audio.pause();   // el audio arranca dentro del toque (iPad, Chrome)
  $("#inicio").classList.add("fuera");
  ponerPausa(false);
  listo.then(function () { escena(1); });
});
$("#pausa").addEventListener("click", function () {
  if (!actual) return;
  if (this.dataset.terminado) { saltar(1); return; }
  ponerPausa(!pausado);
});
$("#atras").addEventListener("click", function () { if (actual) saltar(actual - 1); });
$("#adelante").addEventListener("click", function () { if (actual) saltar(actual + 1); });
$("#verTexto").addEventListener("click", function () {
  var si = document.body.classList.toggle("con-texto");
  this.setAttribute("aria-label", si ? "Ocultar el texto" : "Mostrar el texto"); this.title = this.getAttribute("aria-label");
});

armar();
camara(768, 1376, 2752, 0);
ponerPausa(true);
